<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선언적 함수와 익명함수 실행 우선순위</title>
    <script>
        function tenTimes(callback){
            for(let i=0; i< 10 ; i++){
                callback();
            }
        }

        //let fun = function() {
        //    alert("익명함수입니다.");
        //}

        tenTimes(function() {
            alert("익명함수 호출");
        });
    </script>
</head>
<body>

</body>
</html>
